name: backup

# Operations hardening: weekly logical backup of the irreplaceable data (the
# digest archive and reader feedback), uploaded as a workflow artifact retained
# 90 days. The feed registry is re-seedable from code and is not included.

on:
  schedule:
    - cron: "52 9 * * 1" # Mondays ~05:00 America/Toronto (off-hour)
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: backup
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: backup
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
