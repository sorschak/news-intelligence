name: analyse

# SPEC.md 3.1: daily, pre-digest, ~05:00 America/Toronto. GitHub delays or drops
# top-of-the-hour scheduled runs, so this fires at :23 across several UTC hours
# (covering both DST offsets and typical delays) and the job accepts any run in
# the 05:00–10:00 local window (src/jobs/analyse.ts). The NOT EXISTS scoring
# clause makes repeat slots cheap, so at-most-once-effective per morning.

on:
  schedule:
    - cron: "23 9,10,11,12 * * *"
  workflow_dispatch:

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run analyse
        env:
          TZ: America/Toronto
          ANALYSIS_LOCAL_HOUR: "5"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ANALYSE_MAX_CLUSTERS: "80" # cost/time cap; NOT EXISTS clears the backlog over successive runs
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: claude-sonnet-5
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: analyse
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
