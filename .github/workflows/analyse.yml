name: analyse

# SPEC.md 3.1: daily, pre-digest, ~05:00 America/Toronto. GitHub reliably runs
# FREQUENT schedules (like ingest/cluster) but drops sparse once-a-day ones, so
# this fires every 20 min through the morning; the job accepts any run in the
# 05:00–10:00 local window (src/jobs/analyse.ts) and the NOT EXISTS scoring
# clause makes repeat runs cheap — at-most-once-effective per morning.

on:
  schedule:
    - cron: "5,25,45 9-13 * * *" # every 20 min, 09:00–13:45 UTC (covers ~05:00 ET both DST offsets)
  workflow_dispatch:

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run analyse
        env:
          TZ: America/Toronto
          ANALYSIS_LOCAL_HOUR: "5"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ANALYSE_MAX_CLUSTERS: "300" # daily scoring budget (once-per-day guard bounds cost); deeper coverage for regional stories
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: claude-sonnet-5
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: analyse
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
