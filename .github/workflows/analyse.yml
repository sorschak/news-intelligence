name: analyse

# SPEC.md 3.1: daily, pre-digest, ~05:00 America/Toronto. This repo's SCHEDULED
# runs are heavily throttled by GitHub (most cron slots are dropped — even
# cluster, at every-30-min, only lands ~8x/day), which starved analyse's few
# daily slots to zero. So the PRIMARY trigger is cluster completing (a
# workflow_run event bypasses the schedule throttle); cluster fires several times
# through the morning, and the 05:00–10:00 local window + once-per-day guards in
# src/jobs/analyse.ts make analyse do its scoring pass exactly once. The cron is
# kept only as a best-effort backstop.

on:
  workflow_run:
    workflows: ["cluster"]
    types: [completed]
  schedule:
    - cron: "5,25,45 9-13 * * *"
  workflow_dispatch:

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    # When chained off cluster, only proceed if cluster actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run analyse
        env:
          TZ: America/Toronto
          ANALYSIS_LOCAL_HOUR: "5"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ANALYSE_MAX_CLUSTERS: "300" # daily scoring budget (once-per-day guard bounds cost); deeper coverage for regional stories
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: claude-sonnet-5
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: analyse
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
