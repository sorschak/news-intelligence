name: retention

# Operations hardening: null embeddings on items past the clustering window and
# purge the embedding cache, so the Neon database does not grow without bound
# (embeddings are ~4 KB each and dead weight after 72h). The archive (digest) is
# never touched. Idempotent; timing is not sensitive, so a single daily cron.

on:
  schedule:
    - cron: "37 8,9 * * *" # ~04:00 America/Toronto (off-hour, redundant slots; idempotent)
  workflow_dispatch:

concurrency:
  group: retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run retention
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: "10"
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: retention
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
