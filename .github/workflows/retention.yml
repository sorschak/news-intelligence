name: retention

# Operations hardening: reclaim the 1024-dim vectors (item embeddings, cluster
# centroids, embedding cache) once past the 72h clustering window. The archive
# (digest) is never touched. Idempotent. On the paid tier (10 GB) storage is no
# longer tight, so this runs on a daily schedule rather than on every cluster
# completion — fewer compute wake-ups, lower cost. A couple of off-hour slots
# improve the odds one lands despite GitHub's scheduled-run throttling.

on:
  schedule:
    - cron: "37 7,8,9 * * *"
  workflow_dispatch:

concurrency:
  group: retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run retention
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: "4"
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: retention
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
