name: deliver

# SPEC.md 3.1 / 10.2: daily ~06:00 America/Toronto. This repo's scheduled runs are
# heavily throttled by GitHub, so deliver is driven off workflow completions
# (cluster and analyse) — the reliable path — rather than its own cron, which is
# kept only as a backstop. deliver runs in the 06:00–11:00 local window, but only
# once today's analysis has scored (order guard in src/jobs/deliver.ts) and only
# if no digest exists yet (UNIQUE(edition_date, kind)) — so repeat triggers are
# no-ops and it sends exactly once, after analysis, each morning.

on:
  workflow_run:
    workflows: ["cluster", "analyse"]
    types: [completed]
  schedule:
    - cron: "15,45 10-14 * * *"
  workflow_dispatch:

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    # On a workflow_run trigger, only proceed if analyse actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Cost gate: skip every step (no DB connection, no Neon wake) unless we're
      # in the delivery window. Off-window cluster/analyse completions cost ~2s.
      - id: gate
        run: |
          h=$(date -u +%H)
          if [ "$h" -ge 10 ] && [ "$h" -lt 16 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "deliver: ${h}:00 UTC outside the 10-16 UTC window; skipping (no DB wake)."
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        run: npm run deliver
        env:
          TZ: America/Toronto
          TARGET_LOCAL_HOUR: "6"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          APP_BASE_URL: https://news-intelligence-self.vercel.app
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          ANALYSIS_MODEL: claude-sonnet-5
          SYNTHESIS_MODEL: claude-opus-5
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: deliver
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
