name: deliver

# SPEC.md 3.1 / 10.2: daily 06:00 America/Toronto. Fires at both candidate UTC
# hours and the job exits unless the local hour matches.

on:
  schedule:
    - cron: "0 10,11 * * *" # 06:00 America/Toronto, either DST offset
  workflow_dispatch:

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deliver
        env:
          TZ: America/Toronto
          TARGET_LOCAL_HOUR: "6"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: ${{ secrets.ANALYSIS_MODEL }}
          SYNTHESIS_MODEL: ${{ secrets.SYNTHESIS_MODEL }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
