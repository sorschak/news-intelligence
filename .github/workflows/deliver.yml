name: deliver

# SPEC.md 3.1 / 10.2: daily ~06:00 America/Toronto. Primary trigger is the analyse
# workflow completing (deliver runs immediately after a successful analysis). A
# FREQUENT scheduled backstop (every 30 min through the morning) covers dropped
# chain triggers — GitHub drops sparse schedules but honours frequent ones. The
# job accepts any run in the 06:00–11:00 local window and the digest's
# UNIQUE(edition_date, kind) makes every repeat run a no-op.

on:
  workflow_run:
    workflows: ["analyse"]
    types: [completed]
  schedule:
    - cron: "15,45 10-14 * * *" # every 30 min, 10:00–14:45 UTC (covers ~06:00 ET both DST offsets)
  workflow_dispatch:

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    # On a workflow_run trigger, only proceed if analyse actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deliver
        env:
          TZ: America/Toronto
          TARGET_LOCAL_HOUR: "6"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          ANALYSIS_MODEL: claude-sonnet-5
          SYNTHESIS_MODEL: claude-opus-5
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: deliver
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
