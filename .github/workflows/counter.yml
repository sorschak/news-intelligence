name: counter

# SPEC.md 9.5.2: fortnightly, Sunday 07:00 America/Toronto. Actions cron can't
# express "every 14 days", so when enabled this fires every Sunday at the two
# candidate UTC hours and the job guards on local hour + Sunday; add a 14-day
# parity check to the guard before enabling. Disabled during the ingest soak.

on:
  # schedule:
  #   - cron: "0 11,12 * * 0" # 07:00 America/Toronto on Sundays, either DST offset
  workflow_dispatch:

concurrency:
  group: counter
  cancel-in-progress: false

jobs:
  counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run counter
        env:
          TZ: America/Toronto
          COUNTER_LOCAL_HOUR: "7"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
