name: counter

# SPEC.md 9.5.2: fortnightly, Sunday 07:00 America/Toronto. Actions cron can't
# express "every 14 days", so this fires every Sunday at the two candidate UTC
# hours and the job guards on local hour + Sunday + even-week parity (one Sunday
# in two).

on:
  schedule:
    - cron: "34 11,12,13 * * 0" # Sundays ~07:00 America/Toronto (off-hour, windowed); job guards fortnightly
  workflow_dispatch:

concurrency:
  group: counter
  cancel-in-progress: false

jobs:
  counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run counter
        env:
          TZ: America/Toronto
          COUNTER_LOCAL_HOUR: "7"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          APP_BASE_URL: https://news-intelligence-self.vercel.app
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
      - name: Alert on failure
        if: failure()
        run: npm run alert
        env:
          JOB_NAME: counter
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_PROVIDER: resend
          MAIL_FROM: onboarding@resend.dev
          DIGEST_RECIPIENT: kurt@sorschak.com
